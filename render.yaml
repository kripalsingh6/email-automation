services:
  - type: web
    name: email-automation-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://email-automation-puce.vercel.app
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REDIRECT_URI
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: TEAM_LEAD_EMAIL
        sync: false
      - key: CHECK_CRON
        value: 0 20 * * 1-5
